<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="160" viewBox="0 0 600 160" role="img" aria-labelledby="title description">
<title id="title">Moonlit city — focus</title>
<desc id="description">Decorative rooftop panorama. Subtle cat-tail and window-light animation.</desc>
<g class="rooftop-scene" shape-rendering="crispEdges"><style>
@keyframes rooftop-tail {
  0%,64%,100% { visibility:visible }
  65%,99% { visibility:hidden }
}
@keyframes rooftop-tail-rise {
  0%,64%,73%,90%,100% { visibility:hidden }
  65%,72%,91%,99% { visibility:visible }
}
@keyframes rooftop-tail-curl {
  0%,72%,81%,100% { visibility:hidden }
  73%,80% { visibility:visible }
}
@keyframes rooftop-tail-return {
  0%,80%,91%,100% { visibility:hidden }
  81%,90% { visibility:visible }
}
.tail-rest { animation:rooftop-tail 14s steps(1,end) infinite }
.tail-rise { animation:rooftop-tail-rise 14s steps(1,end) infinite }
.tail-curl { animation:rooftop-tail-curl 14s steps(1,end) infinite }
.tail-return { animation:rooftop-tail-return 14s steps(1,end) infinite }
@keyframes rooftop-window { 0%,38%,44%,100% { opacity:1 } 39%,43% { opacity:.22 } }
.lights-0 { animation:rooftop-window 11s steps(1,end) infinite; animation-delay:-3s }
.lights-1 { animation:rooftop-window 17s steps(1,end) infinite; animation-delay:-9s }
.lights-2 { animation:rooftop-window 23s steps(1,end) infinite; animation-delay:-15s }
@media (prefers-reduced-motion:reduce) {
 .cat-tail-pose,.flicker-window { animation:none }
}
